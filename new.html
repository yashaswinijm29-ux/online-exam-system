<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Exam Monitoring System</title>
<style>
  body { 
    font-family: 'Poppins', sans-serif; 
    background: linear-gradient(135deg, #666aea, #424994a2); 
    color: #3333339f; 
    padding: 30px; 
    transition: all 0.3s ease;
  }

  .container { 
    max-width: 900px; 
    margin: auto; 
    background: rgba(255, 255, 255, 0.95); 
    padding: 25px 35px; 
    border-radius: 15px; 
    box-shadow: 0 20px 40px rgba(0,0,0,0.15); 
    transition: all 0.3s ease;
  }

  h1 { 
    text-align: center; 
    font-size: 2.2em; 
    margin-bottom: 20px; 
    color: #4ecdc4; 
    letter-spacing: 1px; 
  }

  #timer { 
    text-align: center; 
    font-size: 1.6em; 
    font-weight: bold; 
    color: #ff6b6b; 
    margin: 15px 0 25px 0; 
    animation: pulse 1.5s infinite; 
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .question-card { 
    border: 1px solid #ddd; 
    padding: 20px 25px; 
    margin-bottom: 20px; 
    border-radius: 12px; 
    background: #f9f9f9; 
    transition: transform 0.3s ease, box-shadow 0.3s ease; 
  }

  .question-card:hover { 
    transform: translateY(-4px); 
    box-shadow: 0 12px 25px rgba(102,126,234,0.2); 
  }

  .question-card strong { 
    color: #667eea; 
    font-size: 1.1em; 
  }

  label { 
    display: block; 
    margin: 8px 0; 
    padding: 8px 12px; 
    border-radius: 8px; 
    cursor: pointer; 
    background: #fff; 
    transition: all 0.2s ease; 
  }

  label:hover { 
    background: #e0f7fa; 
  }

  input[type="radio"] { 
    margin-right: 12px; 
    transform: scale(1.2); 
    accent-color: #667eea; 
  }

  .submit-btn { 
    background: linear-gradient(135deg, #4ecdc4, #44a08d); 
    color: white; 
    border: none; 
    padding: 15px 35px; 
    font-size: 1.2em; 
    font-weight: bold; 
    border-radius: 50px; 
    cursor: pointer; 
    width: 100%; 
    margin-top: 20px; 
    transition: all 0.3s ease; 
  }

  .submit-btn:hover { 
    transform: translateY(-3px); 
    box-shadow: 0 12px 30px rgba(78, 205, 196, 0.4); 
  }

  .violation-log h3 { 
    color: #ff6b6b; 
    margin-bottom: 10px; 
    font-size: 1.1em; 
  }

  .violation-log ul { 
    list-style: none; 
    padding-left: 0; 
    max-height: 150px; 
    overflow-y: auto; 
  }

  .violation-log li { 
    padding: 6px 8px; 
    border-left: 4px solid #ff6b6b; 
    margin-bottom: 6px; 
    background: #fff5f5; 
    border-radius: 5px; 
    font-size: 0.95em; 
  }

  input#studentId { 
    padding: 8px 12px; 
    font-size: 1em; 
    margin-left: 10px; 
    border-radius: 8px; 
    border: 1px solid #ccc; 
  }

  /* Smooth fade-in for questions */
  .question-card { 
    opacity: 0; 
    animation: fadeIn 0.8s forwards; 
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Online Exam Monitoring System</h1>
  <label>Enter Student ID: <input type="text" id="studentId" placeholder="Your ID"></label>
  <div id="timer">30:00</div>
  Trust Score: <span id="trustScore">100</span>
  <div id="questionsContainer"></div>
  <button class="submit-btn" id="submitBtn">Submit Exam</button>
  <div class="violation-log">
    <h3>Violations:</h3>
    <ul id="violationList"></ul>
  </div>
</div>

<script>

let trustScore = 100;
let violations = [];
let examSubmitted = false;
let questionsData = [];

// TIMER
let timeLeft = 30*60; // 30 minutes
const timerEl = document.getElementById('timer');
function updateTimer() {
  if(examSubmitted) return;
  const m = Math.floor(timeLeft/60).toString().padStart(2,'0');
  const s = (timeLeft%60).toString().padStart(2,'0');
  timerEl.textContent = `${m}:${s}`;
  if(timeLeft>0) timeLeft--;
}
setInterval(updateTimer,1000);

// VIOLATION LOG
function logViolation(message) {
  violations.push(message);
  const ul = document.getElementById('violationList');
  const li = document.createElement('li');
  li.textContent = message;
  ul.appendChild(li);
  // Update trust score
  if(message.includes('Tab')) trustScore = Math.max(0, trustScore - 5);
  else if(message.includes('Copy') || message.includes('Paste') || message.includes('F12') || message.includes('PrintScreen')) trustScore = Math.max(0, trustScore - 10);
  else if(message.includes('idle')) trustScore = Math.max(0, trustScore - 3);
  document.getElementById('trustScore').textContent = trustScore;
}

// FETCH QUESTIONS
function fetchQuestions() {
  const studentId = document.getElementById('studentId').value.trim();
  if(!studentId){ alert("Enter Student ID"); return; }

  fetch(`http://localhost:3000/questions?studentId=${studentId}`)
  .then(res=>res.json())
  .then(data=>{
    questionsData = data;
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';
    data.forEach(q=>{
      const card = document.createElement('div');
      card.className = 'question-card';
      card.innerHTML = `<strong>Q${q.id}:</strong> ${q.question}<br>` +
        q.options.map(opt=>`<label><input type="radio" name="q${q.id}" value="${opt}"> ${opt}</label><br>`).join('');
      container.appendChild(card);
    });
    startIdleTimer();
  })
  .catch(err=>{ alert("Failed to fetch questions"); console.error(err); });
}

// SUBMIT EXAM
document.getElementById('submitBtn').addEventListener('click', ()=>{
  if(examSubmitted) return;
  const studentId = document.getElementById('studentId').value.trim();
  if(!studentId){ alert("Enter Student ID"); return; }

  const answers = {};
  questionsData.forEach(q=>{
    const selected = document.querySelector(`input[name=q${q.id}]:checked`);
    answers[q.id] = selected ? selected.value : null;
  });

  fetch('http://localhost:3000/submit',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ studentId, answers })
  })
  .then(res=>res.json())
  .then(data=>{
    examSubmitted = true;
    alert(`Exam Submitted!\n${data.message}\nTrust Score: ${trustScore}\nViolations: ${violations.length}`);
  })
  .catch(err=>alert('Submit failed'));
});

// TAB SWITCH DETECTION
document.addEventListener('visibilitychange', ()=>{
  if(examSubmitted) return;
  if(document.hidden) logViolation("Tab switched");
});

// KEYBOARD SHORTCUT BLOCKING
document.addEventListener('keydown', e=>{
  if(examSubmitted) return;
  if((e.ctrlKey && (e.key==='c'||e.key==='v')) || e.key==='F12' || e.key==='PrintScreen'){
    e.preventDefault();
    logViolation(`${e.key} attempt detected`);
  }
});

// IDLE DETECTION
let idleTimer;
function startIdleTimer(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(()=>{ if(!examSubmitted) logViolation("User idle detected"); startIdleTimer(); },60000);
}
document.addEventListener('mousemove', startIdleTimer);
document.addEventListener('keydown', startIdleTimer);
document.addEventListener('scroll', startIdleTimer);

// FETCH QUESTIONS AFTER ENTERING STUDENT ID
document.getElementById('studentId').addEventListener('change', fetchQuestions);
// WINDOW RESIZE DETECTION
let initialWidth = window.innerWidth;
let initialHeight = window.innerHeight;

window.addEventListener('resize', () => {
    if(examSubmitted) return; // ignore after submit

    const currentWidth = window.innerWidth;
    const currentHeight = window.innerHeight;
    const screenWidth = screen.width;
    const screenHeight = screen.height;

    // If window is smaller than 80% of screen
    if(currentWidth < screenWidth*0.8 || currentHeight < screenHeight*0.8){
        logViolation(`Window resized to ${currentWidth}x${currentHeight}`);
    }

    initialWidth = currentWidth;
    initialHeight = currentHeight;
});
</script>
</body>
</html>
